plugins { id 'com.android.application' }

def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }

android {
    namespace 'cyou.benconnect.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cyou.benconnect.app'
        minSdk 29
        targetSdk 35
        versionCode releaseVersion.getProperty('versionCode').toInteger()
        versionName releaseVersion.getProperty('versionName')
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// A release must never silently fall back to an unsigned or debug-signed APK.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !signingFile.exists()) {
        throw new GradleException('Signierschlüssel fehlt. Zuerst scripts/init-signing.sh ausführen.')
    }
}
