<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — benconnect</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/welcome.css">
</head>
<body class="welcome-page auth-page">
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <header class="site-header">
    <a class="logo" href="/" aria-label="benconnect Startseite"><span class="brand-mark" aria-hidden="true">b<span>c</span></span><span>benconnect<span class="brand-dot">.</span></span></a>
    <nav aria-label="Hauptnavigation">
      <span id="nav-guest"><a class="nav-login" href="/">Zur Startseite <span aria-hidden="true">↗</span></a></span>
      <span id="nav-user" class="hidden" style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
        <span class="nav-user" id="nav-username"></span>
        <a href="/dashboard.html" class="btn btn-small">Dashboard</a>
        <a href="/laden.html" class="btn btn-small btn-secondary">Laden</a>
        <a href="/chat.html" class="btn btn-small btn-secondary">Chat</a>
        <a href="/settings.html" class="btn btn-small btn-secondary">Einstellungen</a>
        <a href="/admin.html" id="nav-admin" class="btn btn-small hidden">Admin</a>
        <form class="inline-form" action="/logout" method="post">
          <button type="submit" class="btn btn-ghost">Logout</button>
        </form>
      </span>
    </nav>
  </header>

  <main class="container" id="main">
    <ul id="flash-banner" aria-live="polite"></ul>
    <section class="card">
      <p class="eyebrow">SCHÖN, DASS DU DA BIST.</p><h1>Willkommen zurück.</h1><p class="auth-intro">Melde dich an und lerne mit deiner Gruppe weiter.</p>
      <form method="post" action="/login" class="stack-form" autocomplete="on" id="login-form">
        <label>
          Benutzername
          <input name="username" type="text" required autocomplete="username">
        </label>
        <label>
          Passwort
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-block">Einloggen <span aria-hidden="true">→</span></button>
      </form>
      <div class="actions actions-stack">
        <a class="btn btn-secondary" href="/einladung.html">Mit Code registrieren</a>
      </div>
    </section>
  </main>
  <script src="/js/config.js"></script>
  <script src="/js/flash.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/form-handler.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var next = params.get("next");
      var form = document.getElementById("login-form");
      if (next && form) {
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = "next";
        input.value = next;
        form.appendChild(input);
      }
    })();
  </script>
  <script src="/js/footer.js"></script>
</body>
</html>
