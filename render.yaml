services:
  - type: web
    name: lerngruppen-finder
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    autoDeploy: true
    # Persistenz: ist MONGODB_URI gesetzt und erreichbar, liegt der Zustand
    # extern in MongoDB Atlas (Container zustandslos). Ohne (erreichbares)
    # MONGODB_URI faellt die App auf einen lokalen In-Process-Store zurueck –
    # die Seite laeuft dann, die Daten sind aber nicht persistent.
    # Custom Domains (Render-Dashboard -> Settings -> Custom Domains):
    #   benconnect.de, www.benconnect.de
    # Ein einzelner Service liefert Frontend (flutter_app/docs) und API unter
    # derselben Origin aus -> kein Split-Origin, keine Cross-Site-Cookies noetig.
    envVars:
      - key: PORT
        value: "8080"

      # --- MongoDB Atlas (erforderlich) ---
      # MONGODB_URI wird im Render-Dashboard gesetzt (sync: false -> nicht im
      # Repo). Der Dienst startet nicht mit einem fluechtigen lokalen Fallback.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: grouply
      - key: MONGODB_REQUIRED
        value: "1"

      # --- Flask / Session ---
      # Einmalig generierter Secret Key (bleibt ueber Deploys stabil).
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Same-Origin-Betrieb: nur Secure-Cookies erzwingen (HTTPS). Kein
      # SESSION_COOKIE_DOMAIN / FLASK_ALLOWED_ORIGINS mehr noetig, da Frontend
      # und API vom selben Service unter derselben Domain kommen.
      - key: SESSION_COOKIE_SECURE
        value: "1"

      # --- Zeugnis-Auslesung (GPT) ---
      - key: OPENAI_API_KEY
        sync: false

      # --- Gmail SMTP (Lehrer-E-Mails) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
